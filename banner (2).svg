<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="280" rx="24" fill="url(#bg)"/>

  <!-- floating token chips -->
  <g font-family="monospace" font-size="14" fill="#94a3b8">
    <g>
      <rect x="610" y="30" width="80" height="28" rx="8" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="626" y="49">WORD</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="720" y="60" width="100" height="28" rx="8" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="736" y="79">PUNCT</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="650" y="205" width="110" height="28" rx="8" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="666" y="224">NUMBER</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="790" y="170" width="70" height="28" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.5"/>
      <text x="808" y="189">ERR</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- logo -->
  <g transform="translate(40 70) scale(0.7)">
    <rect x="10" y="10" width="180" height="180" rx="40" fill="#0b1020" stroke="url(#g)" stroke-width="4"/>
    <path d="M70 60 L35 100 L70 140" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 60 L165 100 L130 140" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 102 L96 118 L122 84" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;0.3;0.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="200" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#g)">CompilerSpell</text>
  <text x="202" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Formal Language Spell Analyzer</text>

  <!-- rotating taglines -->
  <g font-family="monospace" font-size="16" fill="#22d3ee">
    <text x="202" y="195">&gt; Every sentence is a program.
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.05;0.30;0.35;0.4;0.6;0.7;0.9;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="202" y="195">&gt; Every word is a token.
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.3;0.34;0.37;0.4;0.62;0.67;0.9;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="202" y="195">&gt; Every error is a parse conflict.
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.3;0.5;0.6;0.65;0.67;0.7;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <rect x="202" y="205" width="10" height="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated underline -->
  <rect x="40" y="262" width="820" height="4" rx="2" fill="url(#g)" fill-opacity="0.3"/>
  <rect x="40" y="262" width="120" height="4" rx="2" fill="url(#g)">
    <animate attributeName="x" values="40;740;40" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
