<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="190" rx="20" fill="#0b1020"/>
  <path id="track" d="M60 90 H840" stroke="url(#g)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="55" width="140" height="70" rx="14" fill="#111936" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.3;0.3;0.3;0.3;1" keyTimes="0;0.1;0.2;0.8;0.9;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="85" fill="#e2e8f0" font-size="15" font-weight="700">Lexer</text>
    <text x="90" y="106" fill="#94a3b8" font-size="12">tokens</text>
    <!-- 2 -->
    <rect x="200" y="55" width="140" height="70" rx="14" fill="#111936" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3;0.3;0.3" keyTimes="0;0.2;0.3;0.8;0.9;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="270" y="85" fill="#e2e8f0" font-size="15" font-weight="700">SDD</text>
    <text x="270" y="106" fill="#94a3b8" font-size="12">attributes</text>
    <!-- 3 -->
    <rect x="380" y="55" width="140" height="70" rx="14" fill="#111936" stroke="#818cf8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;0.3;1;0.3;0.3;0.3" keyTimes="0;0.3;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="85" fill="#e2e8f0" font-size="15" font-weight="700">LR Parser</text>
    <text x="450" y="106" fill="#94a3b8" font-size="12">tables + trace</text>
    <!-- 4 -->
    <rect x="560" y="55" width="140" height="70" rx="14" fill="#111936" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;0.3;0.3;1;0.3;0.3" keyTimes="0;0.5;0.6;0.7;0.8;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="630" y="85" fill="#e2e8f0" font-size="15" font-weight="700">Auto-Correct</text>
    <text x="630" y="106" fill="#94a3b8" font-size="12">code generation</text>
    <!-- 5 -->
    <rect x="740" y="55" width="140" height="70" rx="14" fill="#111936" stroke="#4ade80" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;0.3;0.3;0.3;1;0.3" keyTimes="0;0.7;0.8;0.85;0.9;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="810" y="85" fill="#e2e8f0" font-size="15" font-weight="700">AST</text>
    <text x="810" y="106" fill="#94a3b8" font-size="12">visualization</text>

    <text x="90" y="30" fill="#64748b" font-size="12">Input Text</text>
    <text x="810" y="165" fill="#64748b" font-size="12">Report + Output</text>
  </g>

  <!-- travelling packet -->
  <circle r="7" fill="#22d3ee">
    <animateMotion dur="10s" repeatCount="indefinite" path="M60 90 H840"/>
    <animate attributeName="fill" values="#22d3ee;#a78bfa;#4ade80" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
